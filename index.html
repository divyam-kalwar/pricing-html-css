<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="reset.css" />
    <script defer src="index.js"></script>
    <title>Pricing component</title>
  </head>

  <body>
    
    <div class="all-data-plan">
      <h2>Our Pricing</h2>
      <div class="annually-monthly-plan">
        <div class="plan-detail">Annually</div>
        <div>
          <input type="checkbox" id="toggle" />
          <label for="toggle" class="toggle-label"></label>
        </div>

        <div class="plan-detail">Monthly</div>
      </div>
      <div class="price-wise-data-plan">
        <div class="data-basic-master">
          <p>Basic</p>
          <div class="price-tag">
            <h3 class="dollar-sign">$</h3>
            <h1 class="basic-price">199.99</h1>
          </div>

          <ul class="plan-list">
            <li>500 GB Storage</li>

            <li>2 Users Allowed</li>

            <li>Send up to 3 GB</li>
          </ul>

          <button>LEARN MORE</button>
        </div>

        <div class="data-professional">
          <p>Professional</p>
          <div class="price-tag">
            <h3 class="dollar-sign-professional">$</h3>
            <h1 class="professional-price">249.99</h1>
          </div>

          <ul class="plan-list-professional">
            <li>1 TB Storage</li>

            <li>5 Users Allowed</li>

            <li>Send up to 10 GB</li>
          </ul>

          <button class="btn-professional">LEARN MORE</button>
        </div>

        <div class="data-basic-master">
          <p>Master</p>
          <div class="price-tag">
            <h3 class="dollar-sign">$</h3>
            <h1 class="master-price" >399.99</h1>
          </div>

          <ul class="plan-list">
            <li>2 TB Storage</li>

            <li>10 Users Allowed</li>

            <li>Send up to 20 GB</li>
          </ul>
          <button>LEARN MORE</button>
        </div>
      </div>
    </div>
  </body>
</html>
